name: Build and publish FedOps website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test Markdown and deployment settings
        run: python -m unittest discover -s tests -v
      - name: Build the public site
        env:
          FEDOPS_ENV: production
          FEDOPS_BASE_PATH: /${{ github.event.repository.name }}
          FEDOPS_OUTPUT_DIR: _site
          FEDOPS_CONSOLE_URL: ${{ vars.FEDOPS_CONSOLE_URL || 'https://ccl.gachon.ac.kr/fedops' }}
          FEDOPS_REGISTRY_URL: ${{ vars.FEDOPS_REGISTRY_URL || 'https://ccl.gachon.ac.kr/fedops/registry' }}
        run: python build.py
      - name: Validate routes, assets, Docs and public service links
        run: python work/validate.py --root _site --base-path /${{ github.event.repository.name }} --public
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
